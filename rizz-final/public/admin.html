<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rizz Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><a class="logo" href="/">RIZZ<span>.</span><small>ADMIN DASHBOARD</small></a><div><a class="btn" href="/">Storefront</a> <button id="logout" class="btn">Logout</button></div></header><main class="section"><div class="section-head"><div><span class="eyebrow">Owner only</span><h2>Control room.</h2></div></div><div id="root"></div></main><script>
const root=document.querySelector('#root');const api=async(u,o={})=>{const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});const d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d};const money=n=>'₹'+Number(n).toLocaleString('en-IN');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let products=[];
async function load(){try{await api('/api/auth/me');products=await api('/api/admin/products');const orders=await api('/api/orders');root.innerHTML=`<div class="admin-grid"><div class="panel"><h3>Add product</h3><form id="add" class="form"><input id="n" placeholder="Product name" required><select id="c"><option>shirts</option><option>pants</option><option>t-shirts</option><option>dresses</option></select><textarea id="d" placeholder="Description" required></textarea><input id="p" type="number" placeholder="Price (INR)" required><input id="i" placeholder="Image URL" required><input id="s" placeholder="Sizes e.g. S,M,L,XL" value="S,M,L,XL"><input id="co" placeholder="Colors" value="Black"><input id="st" type="number" placeholder="Stock" value="10"><button class="btn gold">Publish product</button></form></div><div class="panel"><h3>Store status</h3><p>${products.filter(p=>p.active&&p.stock).length} active products</p><p>${products.filter(p=>!p.stock).length} out of stock</p><p>${orders.length} total orders</p><p class="muted">Owner email: arjunchandu2311@gmail.com</p></div></div><section style="margin-top:35px"><h3>Products & inventory</h3><div style="overflow:auto"><table class="admin-table"><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Active</th><th>Action</th></tr></thead><tbody>${products.map((p,idx)=>`<tr><td>${esc(p.name)}<br><small>${esc(p.category)}</small></td><td><input id="price${p.id}" value="${p.price}" type="number"></td><td><input id="stock${p.id}" value="${p.stock}" type="number"></td><td><input id="active${p.id}" type="checkbox" ${p.active?'checked':''}></td><td><button class="btn" onclick="updateP(${p.id})">Save</button></td></tr>`).join('')}</tbody></table></div></section><section style="margin-top:45px"><h3>Orders</h3><div style="overflow:auto"><table class="admin-table"><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody>${orders.map(o=>`<tr><td>#${o.id}<br><small>${new Date(o.created_at).toLocaleString()}</small></td><td>${esc(o.customer_name)}<br>${esc(o.customer_email)}<br>${esc(o.customer_phone)}<br>${esc(o.address)}</td><td>${o.items.map(i=>`${esc(i.product_name)} · ${esc(i.variant)} × ${i.quantity}`).join('<br>')}</td><td>${money(o.total)}<br>${esc(o.payment_method)} / ${esc(o.payment_status)}</td><td><select onchange="status(${o.id},this.value)">${['Pending','Confirmed','Packed','Shipped','Delivered','Cancelled'].map(s=>`<option ${o.order_status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></section>`;document.querySelector('#add').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/products',{method:'POST',body:JSON.stringify({name:n.value,category:c.value,description:d.value,price:p.value,image:i.value,sizes:s.value.split(','),colors:co.value.split(','),stock:st.value,active:true})});load()}catch(e){alert(e.message)}}}catch(e){root.innerHTML='<div class="panel">Admin login required. <a href="/#login"><u>Login</u></a></div>'}}
window.updateP=async id=>{const p=products.find(x=>x.id===id);await api('/api/admin/products/'+id,{method:'PUT',body:JSON.stringify({...p,price:document.querySelector('#price'+id).value,stock:document.querySelector('#stock'+id).value,active:document.querySelector('#active'+id).checked})});load()};window.status=async(id,s)=>{await api('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({status:s})});load()};document.querySelector('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.href='/'};load();
</script></body></html>
